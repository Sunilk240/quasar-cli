site_name: QUASAR
site_url: https://sunilk240.github.io/quasar-cli/
site_description: AI-Powered CLI Code Editor
site_author: Sunil Kumawat
repo_url: https://github.com/Sunilk240/quasar-cli
repo_name: Sunilk240/quasar-cli

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Left sidebar navigation (no top tabs)
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    # Right-side table of contents
    - toc.integrate
    # Search
    - search.suggest
    - search.highlight
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# Custom CSS for LangChain-like styling
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Providers:
      - providers/index.md
      - Groq: providers/groq.md
      - Cerebras: providers/cerebras.md
      - Ollama: providers/ollama.md
  - Features:
      - features/index.md
      - Model Selection: features/model-selection.md
      - Task Types: features/task-types.md
      - Backup & Recovery: features/backup-recovery.md
      - Security: features/security.md
  - .quasar Directory:
      - quasar-directory/index.md
      - context.md: quasar-directory/context-md.md
      - MCP Integration: quasar-directory/mcp-integration.md
      - Hooks System: quasar-directory/hooks-system.md
      - Session Memory: quasar-directory/memory.md
  - Tools:
      - tools/index.md
      - File Tools: tools/file-tools.md
      - Search Tools: tools/search-tools.md
      - Web Tools: tools/web-tools.md
      - Terminal Tools: tools/terminal-tools.md
      - Code Intelligence: tools/code-intelligence.md
  - API Reference: api/cli-reference.md
  - About:
      - Changelog: about/changelog.md
      - Contributing: about/contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra:
  generator: false  # Hide "Made with Material for MkDocs" footer
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sunilk240/quasar-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/quasar-ai/
